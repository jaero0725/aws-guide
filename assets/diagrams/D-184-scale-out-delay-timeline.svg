<svg viewBox="0 0 720 456" role="img" aria-labelledby="d184-title d184-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d184-title">트래픽 급증에 스케일아웃이 늦는 구간</title>
  <desc id="d184-desc">가로축은 시간이고 세로축은 요청량과 용량입니다. 축에는 값을 쓰지 않고 구간 이름만 씁니다.
    평소에는 용량 선이 트래픽 선보다 위에 있어 여유가 있습니다. 어느 시점에 트래픽이 수직에 가깝게 급증하지만 용량 선은 한동안 그대로 있습니다.
    그 사이가 용량이 부족한 구간이며 붉은 영역으로 표시했습니다.
    부족 구간은 네 조각으로 쪼개집니다. 먼저 지표가 집계되어 CloudWatch 에 도착하는 지연이 있고,
    그다음 알람이 정해진 평가 기간 동안 조건을 확인하는 시간이 있고, 그다음 Auto Scaling 이 인스턴스를 시작하는 시간이 있고,
    마지막으로 인스턴스가 부팅과 배포를 마치고 상태 확인을 통과하는 초기화와 워밍업 시간이 있습니다.
    이 네 조각이 모두 지난 뒤에야 용량 선이 올라가 트래픽을 수용합니다.
    아래 두 상자는 이 구간을 줄이는 방법입니다. 예약 스케일링은 급증 시각을 미리 알 때 지표와 알람 구간을 통째로 없애고,
    큐로 완충하면 처리 지연은 생기더라도 요청이 유실되지 않으므로 부족 구간의 피해 자체를 흡수합니다.</desc>

  <text class="dg-fs-md dg-bold" x="20" y="26">트래픽은 즉시 오르고 용량은 네 구간을 지나야 오릅니다</text>

  <!-- 축 -->
  <text class="dg-fs-sm dg-muted" x="20" y="60">요청량 · 용량</text>
  <path class="dg-grid" d="M90 66 L90 250 M90 250 L706 250"/>

  <!-- 부족 영역 -->
  <rect x="195" y="88" width="388" height="122" fill="var(--dg-danger-soft)" stroke="none"/>
  <text class="dg-fs-md dg-bold" x="389" y="140" text-anchor="middle">용량이 부족한 구간</text>
  <text class="dg-fs-sm" x="389" y="162" text-anchor="middle">요청이 대기하거나 실패합니다</text>

  <!-- 곡선 -->
  <path class="dg-edge dg-edge--accent" d="M100 222 L185 222 L195 88 L700 88"/>
  <path class="dg-edge dg-edge--ok dg-edge--dashed" d="M100 210 L575 210 L590 105 L700 105"/>
  <text class="dg-fs-sm dg-bold" x="620" y="80">트래픽</text>
  <text class="dg-fs-sm dg-bold" x="620" y="126">용량</text>

  <!-- 경계 -->
  <path class="dg-grid" d="M195 88 L195 290 M583 88 L583 290"/>

  <!-- 구간 -->
  <rect class="dg-node dg-node--warn" x="195" y="258" width="90" height="32" rx="4"/>
  <text class="dg-fs-sm" x="240" y="279" text-anchor="middle">지표 집계</text>
  <rect class="dg-node dg-node--warn" x="285" y="258" width="75" height="32" rx="4"/>
  <text class="dg-fs-sm" x="322" y="279" text-anchor="middle">알람 평가</text>
  <rect class="dg-node dg-node--warn" x="360" y="258" width="110" height="32" rx="4"/>
  <text class="dg-fs-sm" x="415" y="279" text-anchor="middle">인스턴스 시작</text>
  <rect class="dg-node dg-node--warn" x="470" y="258" width="113" height="32" rx="4"/>
  <text class="dg-fs-sm" x="526" y="279" text-anchor="middle">초기화 · 워밍업</text>
  <rect class="dg-node dg-node--ok" x="583" y="258" width="117" height="32" rx="4"/>
  <text class="dg-fs-sm" x="641" y="279" text-anchor="middle">트래픽 수용</text>

  <!-- 완화책 -->
  <rect class="dg-node dg-node--ok" x="20" y="306" width="330" height="80" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="34" y="330">예약 스케일링</text>
  <text class="dg-fs-sm" x="34" y="352">급증 시각을 미리 알고 있을 때 씁니다</text>
  <text class="dg-fs-sm dg-bold" x="34" y="374">지표 집계와 알람 평가 구간을 없앱니다</text>

  <rect class="dg-node dg-node--ok" x="370" y="306" width="330" height="80" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="384" y="330">큐로 완충 (Amazon SQS)</text>
  <text class="dg-fs-sm" x="384" y="352">요청을 큐에 받아 두고 뒤에서 처리합니다</text>
  <text class="dg-fs-sm dg-bold" x="384" y="374">지연은 생겨도 유실은 없습니다</text>

  <rect class="dg-node dg-node--accent" x="20" y="400" width="680" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="428" text-anchor="middle">Auto Scaling 을 켜 두었다는 것과 급증에 대비되었다는 것은 다른 말입니다</text>
</svg>
