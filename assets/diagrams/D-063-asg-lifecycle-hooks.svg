<svg viewBox="0 0 720 350" role="img" aria-labelledby="d063-title d063-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d063-title">Auto Scaling 그룹 수명주기 훅과 상태 전이</title>
  <desc id="d063-desc">Auto Scaling 그룹 인스턴스의 상태 기계를 왼쪽에서 오른쪽으로 그린 그림입니다.
    스케일 아웃이 시작되면 인스턴스는 Pending 상태가 되고, 시작 수명주기 훅이 걸려 있으면 Pending:Wait 에서 멈춥니다.
    이 대기 구간에서 애플리케이션 설치나 설정 반영 같은 초기화를 끝내고 CONTINUE 를 보내야 InService 로 넘어가 트래픽을 받습니다.
    스케일 인이나 종료가 시작되면 Terminating 을 거쳐, 종료 수명주기 훅이 있으면 Terminating:Wait 에서 멈춥니다.
    이 대기 구간에서 로그를 회수하고 연결을 드레이닝한 뒤 CONTINUE 를 보내면 Terminated 로 끝납니다.
    훅 대기는 무한하지 않아서 하트비트 시간이 지나면 미리 정한 기본 동작으로 자동 진행됩니다.</desc>

  <defs>
    <marker id="d063-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d063-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="dg-node" x="20" y="112" width="120" height="64" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="80" y="138" text-anchor="middle">Pending</text>
  <text class="dg-fs-sm dg-muted" x="80" y="160" text-anchor="middle">시작 요청</text>

  <rect class="dg-node dg-node--accent" x="160" y="112" width="120" height="64" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="220" y="138" text-anchor="middle">Pending:Wait</text>
  <text class="dg-fs-sm" x="220" y="160" text-anchor="middle">시작 훅 대기</text>

  <rect class="dg-node" x="300" y="112" width="120" height="64" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="360" y="138" text-anchor="middle">InService</text>
  <text class="dg-fs-sm dg-muted" x="360" y="160" text-anchor="middle">트래픽 수용</text>

  <rect class="dg-node dg-node--accent" x="440" y="112" width="120" height="64" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="500" y="138" text-anchor="middle">Terminating:</text>
  <text class="dg-fs-sm dg-mono dg-bold" x="500" y="156" text-anchor="middle">Wait</text>
  <text class="dg-fs-sm" x="500" y="174" text-anchor="middle">종료 훅 대기</text>

  <rect class="dg-node" x="580" y="112" width="120" height="64" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="640" y="138" text-anchor="middle">Terminated</text>
  <text class="dg-fs-sm dg-muted" x="640" y="160" text-anchor="middle">제거 완료</text>

  <path class="dg-edge" d="M140 144 L156 144" marker-end="url(#d063-ar)"/>
  <path class="dg-edge dg-edge--accent" d="M280 144 L296 144" marker-end="url(#d063-ar-accent)"/>
  <path class="dg-edge" d="M420 144 L436 144" marker-end="url(#d063-ar)"/>
  <path class="dg-edge dg-edge--accent" d="M560 144 L576 144" marker-end="url(#d063-ar-accent)"/>

  <text class="dg-fs-sm dg-bold" x="288" y="106">CONTINUE</text>
  <text class="dg-fs-sm dg-bold" x="528" y="106">CONTINUE</text>

  <rect class="dg-node dg-node--alt" x="130" y="30" width="180" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="220" y="52" text-anchor="middle">시작 훅이 하는 일</text>
  <text class="dg-fs-sm dg-muted" x="220" y="74" text-anchor="middle">초기화 완료까지 대기</text>
  <path class="dg-edge dg-edge--dashed" d="M220 90 L220 108" marker-end="url(#d063-ar)"/>

  <rect class="dg-node dg-node--alt" x="410" y="198" width="180" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="500" y="220" text-anchor="middle">종료 훅이 하는 일</text>
  <text class="dg-fs-sm dg-muted" x="500" y="242" text-anchor="middle">로그 회수 · 드레이닝</text>
  <path class="dg-edge dg-edge--dashed" d="M500 180 L500 194" marker-end="url(#d063-ar)"/>

  <text class="dg-fs-sm dg-muted" x="20" y="288">훅이 걸린 대기 상태에서는 상태 전이가 멈춰 있어 원하는 작업을 끼워 넣을 수 있습니다</text>
  <text class="dg-fs-sm dg-muted" x="20" y="312">하트비트 시간이 지나면 미리 정한 기본 동작(CONTINUE 또는 ABANDON)으로 자동 진행됩니다</text>
  <text class="dg-fs-sm dg-muted" x="20" y="336">시간이 더 필요하면 하트비트를 갱신해 대기를 연장합니다</text>
</svg>
