<svg viewBox="0 0 720 400" role="img" aria-labelledby="d030-title d030-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d030-title">VPC 피어링의 비전이성과 Transit Gateway 허브</title>
  <desc id="d030-desc">왼쪽은 VPC 네 개를 서로 모두 통하게 만든 피어링 구성입니다.
    피어링은 전이 라우팅을 지원하지 않아 중간 VPC 를 거쳐 갈 수 없으므로 통신이 필요한 모든 쌍에 직접 연결을 만들어야 하고,
    연결 수는 N 곱하기 N 빼기 1 을 2로 나눈 값으로 늘어납니다. VPC 가 넷이면 여섯 개, 열이면 마흔다섯 개입니다.
    오른쪽은 같은 네 VPC 를 Transit Gateway 허브에 붙인 구성입니다.
    연결 수가 VPC 개수와 같아지고 라우팅 테이블을 허브 한 곳에서 관리하게 됩니다.
    VPC 수가 늘어날수록 선택이 피어링에서 Transit Gateway 로 넘어가는 지점이 이 그림의 결론입니다.</desc>

  <text class="dg-fs-md dg-bold" x="180" y="30" text-anchor="middle">VPC 피어링 — 완전 연결</text>
  <text class="dg-fs-md dg-bold" x="550" y="30" text-anchor="middle">Transit Gateway 허브</text>

  <path class="dg-grid" d="M360 46 L360 320"/>

  <!-- 피어링 메시 -->
  <path class="dg-edge" d="M105 114 L255 114"/>
  <path class="dg-edge" d="M105 114 L105 250"/>
  <path class="dg-edge" d="M255 114 L255 250"/>
  <path class="dg-edge" d="M105 250 L255 250"/>
  <path class="dg-edge" d="M105 114 L255 250"/>
  <path class="dg-edge" d="M255 114 L105 250"/>

  <rect class="dg-node" x="60" y="70" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="105" y="98" text-anchor="middle">VPC A</text>
  <rect class="dg-node" x="210" y="70" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="255" y="98" text-anchor="middle">VPC B</text>
  <rect class="dg-node" x="60" y="250" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="105" y="278" text-anchor="middle">VPC C</text>
  <rect class="dg-node" x="210" y="250" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="255" y="278" text-anchor="middle">VPC D</text>

  <text class="dg-fs-sm dg-bold" x="180" y="314" text-anchor="middle">연결 6개 = N(N-1)/2</text>

  <!-- TGW 허브 -->
  <path class="dg-edge dg-edge--accent" d="M475 114 L522 158"/>
  <path class="dg-edge dg-edge--accent" d="M625 114 L578 158"/>
  <path class="dg-edge dg-edge--accent" d="M475 250 L522 206"/>
  <path class="dg-edge dg-edge--accent" d="M625 250 L578 206"/>

  <rect class="dg-node" x="430" y="70" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="475" y="98" text-anchor="middle">VPC A</text>
  <rect class="dg-node" x="580" y="70" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="625" y="98" text-anchor="middle">VPC B</text>
  <rect class="dg-node" x="430" y="250" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="475" y="278" text-anchor="middle">VPC C</text>
  <rect class="dg-node" x="580" y="250" width="90" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="625" y="278" text-anchor="middle">VPC D</text>

  <rect class="dg-node dg-node--accent" x="480" y="158" width="140" height="48" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="550" y="188" text-anchor="middle">Transit Gateway</text>

  <text class="dg-fs-sm dg-bold" x="550" y="314" text-anchor="middle">연결 4개 = N</text>

  <rect class="dg-node dg-node--warn" x="20" y="332" width="330" height="58" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="185" y="354" text-anchor="middle">전이 라우팅이 되지 않습니다</text>
  <text class="dg-fs-sm" x="185" y="376" text-anchor="middle">중간 VPC 를 거쳐 갈 수 없어 쌍마다 직접 연결</text>

  <rect class="dg-node dg-node--accent" x="370" y="332" width="330" height="58" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="535" y="354" text-anchor="middle">허브에서 전이 라우팅을 처리합니다</text>
  <text class="dg-fs-sm" x="535" y="376" text-anchor="middle">라우팅 테이블을 한곳에서 관리합니다</text>
</svg>
