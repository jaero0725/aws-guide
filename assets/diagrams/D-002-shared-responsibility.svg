<svg viewBox="0 0 720 480" role="img" aria-labelledby="d002-title d002-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d002-title">책임 공유 모델의 경계선 이동</title>
  <desc id="d002-desc">같은 일곱 개 계층을 EC2, Amazon RDS, AWS Lambda 세 서비스에 대해 나란히 놓고
    AWS 책임과 고객 책임의 경계선이 어디에 그어지는지 비교합니다.
    EC2 에서는 물리 시설과 가상화까지만 AWS 책임이고 게스트 OS 패치부터 위쪽은 모두 고객 책임입니다.
    Amazon RDS 에서는 게스트 OS 와 데이터베이스 엔진 패치까지 AWS 가 맡고, 확장과 가용성 구성부터 고객이 맡습니다.
    AWS Lambda 에서는 확장과 가용성까지 AWS 가 맡고 고객에게는 코드와 데이터, 접근 제어만 남습니다.
    관리형으로 갈수록 경계선이 위로 올라가며, 어느 계층에서든 데이터 분류와 암호화, 접근 제어는 항상 고객 책임입니다.
    "이 상황에서 패치는 누구 책임인가"라는 문항의 답이 서비스마다 다른 이유가 바로 이 경계선의 위치입니다.</desc>

  <text class="dg-fs-sm dg-muted" x="20" y="34">계층</text>
  <text class="dg-fs-md dg-bold" x="295" y="34" text-anchor="middle">Amazon EC2</text>
  <text class="dg-fs-md dg-bold" x="465" y="34" text-anchor="middle">Amazon RDS</text>
  <text class="dg-fs-md dg-bold" x="630" y="34" text-anchor="middle">AWS Lambda</text>
  <text class="dg-fs-sm dg-muted" x="295" y="54" text-anchor="middle">IaaS</text>
  <text class="dg-fs-sm dg-muted" x="465" y="54" text-anchor="middle">관리형</text>
