<svg viewBox="0 0 720 516" role="img" aria-labelledby="d151-title d151-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d151-title">KMS 키 세 종류의 통제 범위와 접근을 결정하는 세 겹</title>
  <desc id="d151-desc">위쪽은 KMS 키 세 종류를 고객이 제어할 수 있는 범위 축 위에 왼쪽부터 놓은 그림입니다.
    AWS 소유 키는 AWS 가 여러 계정에서 공용으로 쓰며 계정 안에서 조회조차 되지 않아 제어 범위가 없습니다.
    AWS 관리형 키는 서비스가 계정 안에 자동으로 만들고 aws 로 시작하는 별칭이 붙으며, 사용 내역은 볼 수 있지만 키 정책은 편집할 수 없습니다.
    고객 관리형 키만 우리가 CreateKey 로 직접 만들고 키 정책, 별칭, 자동 교체, 비활성화, 삭제 일정, 교차 계정 공유를 모두 통제합니다.
    그 아래 띠는 자동 교체의 경계입니다. 앞의 두 종류는 교체 주기를 AWS 가 정하고, 고객 관리형 키에서만 자동 교체를 직접 켜고 끄며 주기를 지정할 수 있습니다.
    아래쪽은 접근 결정 구조입니다. 키 정책, IAM 정책, 권한 부여 세 겹이 함께 판정하며 세 갈래 화살표가 하나의 결론으로 모입니다.
    키 정책은 모든 KMS 키에 반드시 하나 붙어 있고, 키 정책이 허용하지 않으면 IAM 정책만으로는 그 키를 쓸 수 없다는 것이 이 그림의 결론입니다.</desc>

  <defs>
    <marker id="d151-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d151-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="26">키 종류 — 고객이 제어할 수 있는 범위</text>

  <!-- 카드 1 -->
  <rect class="dg-node dg-node--muted" x="20" y="40" width="216" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="128" y="64" text-anchor="middle">AWS 소유 키</text>
  <path class="dg-grid" d="M20 74 L236 74"/>
  <text class="dg-fs-sm dg-muted" x="34" y="96">만드는 주체</text>
  <text class="dg-fs-sm" x="34" y="116">AWS · 여러 계정 공용</text>
  <text class="dg-fs-sm dg-muted" x="34" y="142">우리가 할 수 있는 것</text>
  <text class="dg-fs-sm dg-bold" x="34" y="162">없음</text>
  <text class="dg-fs-sm" x="34" y="182">계정에서 조회되지 않습니다</text>

  <!-- 카드 2 -->
  <rect class="dg-node" x="252" y="40" width="216" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="64" text-anchor="middle">AWS 관리형 키</text>
  <path class="dg-grid" d="M252 74 L468 74"/>
  <text class="dg-fs-sm dg-muted" x="266" y="96">만드는 주체</text>
  <text class="dg-fs-sm" x="266" y="116">서비스가 자동 생성</text>
  <text class="dg-fs-sm dg-mono" x="266" y="136">alias/aws/s3</text>
  <text class="dg-fs-sm dg-muted" x="266" y="158">우리가 할 수 있는 것</text>
  <text class="dg-fs-sm" x="266" y="178">사용 내역 조회만 가능</text>

  <!-- 카드 3 -->
  <rect class="dg-node dg-node--accent" x="484" y="40" width="216" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="592" y="64" text-anchor="middle">고객 관리형 키</text>
  <path class="dg-grid" d="M484 74 L700 74"/>
  <text class="dg-fs-sm dg-muted" x="498" y="96">만드는 주체</text>
  <text class="dg-fs-sm dg-bold" x="498" y="116">우리가 CreateKey 로</text>
  <text class="dg-fs-sm dg-muted" x="498" y="142">우리가 할 수 있는 것</text>
  <text class="dg-fs-sm" x="498" y="162">키 정책 · 별칭 · 비활성화</text>
  <text class="dg-fs-sm" x="498" y="182">삭제 일정 · 교차 계정 공유</text>

  <!-- 제어 범위 축 -->
  <path class="dg-edge dg-edge--accent" d="M20 210 L698 210" marker-end="url(#d151-ar-accent)"/>
  <text class="dg-fs-sm dg-muted" x="20" y="230">제어 범위 없음</text>
  <text class="dg-fs-sm dg-bold" x="700" y="230" text-anchor="end">전부 통제</text>

  <!-- 자동 교체 띠 -->
  <text class="dg-fs-md dg-bold" x="20" y="258">자동 교체를 켤 수 있는 경계</text>
  <rect class="dg-node dg-node--muted" x="20" y="268" width="216" height="40" rx="4"/>
  <text class="dg-fs-sm" x="128" y="293" text-anchor="middle">AWS 가 알아서 교체</text>
  <rect class="dg-node dg-node--muted" x="252" y="268" width="216" height="40" rx="4"/>
  <text class="dg-fs-sm" x="360" y="293" text-anchor="middle">AWS 가 자동 교체</text>
  <rect class="dg-node dg-node--ok" x="484" y="268" width="216" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="592" y="293" text-anchor="middle">직접 켜고 주기 지정</text>

  <!-- 접근 세 겹 -->
  <text class="dg-fs-md dg-bold" x="20" y="342">키 접근은 세 겹이 함께 결정합니다</text>

  <rect class="dg-node dg-node--accent" x="20" y="356" width="200" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="120" y="382" text-anchor="middle">키 정책</text>
  <text class="dg-fs-sm" x="120" y="402" text-anchor="middle">키마다 반드시 하나</text>

  <rect class="dg-node" x="260" y="356" width="200" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="382" text-anchor="middle">IAM 정책</text>
  <text class="dg-fs-sm" x="360" y="402" text-anchor="middle">호출자에게 붙는 권한</text>

  <rect class="dg-node" x="500" y="356" width="200" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="600" y="382" text-anchor="middle">권한 부여 (grant)</text>
  <text class="dg-fs-sm" x="600" y="402" text-anchor="middle">한시적 위임</text>

  <path class="dg-edge dg-edge--accent" d="M120 416 L120 452" marker-end="url(#d151-ar-accent)"/>
  <path class="dg-edge" d="M360 416 L360 452" marker-end="url(#d151-ar)"/>
  <path class="dg-edge" d="M600 416 L600 452" marker-end="url(#d151-ar)"/>

  <rect class="dg-node dg-node--ok" x="20" y="456" width="680" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="480" text-anchor="middle">세 겹을 모두 통과해야 이 KMS 키를 쓸 수 있습니다</text>
  <text class="dg-fs-sm" x="360" y="500" text-anchor="middle">키 정책이 허용하지 않으면 IAM 정책만으로는 접근할 수 없습니다</text>
</svg>
