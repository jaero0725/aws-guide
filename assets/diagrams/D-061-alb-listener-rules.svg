<svg viewBox="0 0 720 410" role="img" aria-labelledby="d061-title d061-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d061-title">ALB 리스너 · 규칙 · 타깃 그룹의 처리 순서</title>
  <desc id="d061-desc">요청이 Application Load Balancer 안에서 내려가는 순서입니다.
    먼저 포트와 프로토콜로 정해진 리스너가 요청을 받고, 리스너에 붙은 규칙들을 우선순위 번호가 낮은 것부터 차례로 평가합니다.
    호스트 헤더, 경로, HTTP 헤더 같은 조건 가운데 처음으로 일치하는 규칙에서 평가가 멈추고 그 규칙이 지정한 타깃 그룹으로 요청이 넘어갑니다.
    어떤 규칙에도 걸리지 않으면 항상 마지막에 놓이는 기본 규칙이 처리합니다.
    타깃 그룹은 등록된 대상 가운데 헬스체크를 통과한 대상에만 요청을 보냅니다.
    같은 규칙 집합이라도 우선순위 번호를 바꾸면 도착하는 타깃 그룹이 달라진다는 것이 이 그림의 요점입니다.</desc>

  <defs>
    <marker id="d061-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d061-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="dg-node" x="20" y="112" width="110" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="75" y="146" text-anchor="middle">요청</text>

  <rect class="dg-node" x="160" y="112" width="140" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="230" y="136" text-anchor="middle">리스너</text>
  <text class="dg-fs-sm dg-mono" x="230" y="156" text-anchor="middle">HTTPS:443</text>

  <path class="dg-edge" d="M130 140 L156 140" marker-end="url(#d061-ar)"/>
  <path class="dg-edge" d="M300 140 L326 140" marker-end="url(#d061-ar)"/>

  <rect class="dg-panel" x="330" y="40" width="226" height="250" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="340" y="60">규칙 — 우선순위 순 평가</text>

  <path class="dg-edge dg-edge--accent" d="M346 78 L346 268" marker-end="url(#d061-ar-accent)"/>

  <circle cx="346" cy="91" r="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="346" y="96" text-anchor="middle">1</text>
  <circle cx="346" cy="145" r="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="346" y="150" text-anchor="middle">2</text>
  <circle cx="346" cy="199" r="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="346" y="204" text-anchor="middle">3</text>
  <circle cx="346" cy="253" r="10" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="346" y="258" text-anchor="middle">4</text>

  <rect class="dg-node" x="364" y="68" width="184" height="46" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="372" y="86">우선순위 10</text>
  <text class="dg-fs-sm dg-mono" x="372" y="105">Host: api.example.com</text>

  <rect class="dg-node" x="364" y="122" width="184" height="46" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="372" y="140">우선순위 20</text>
  <text class="dg-fs-sm dg-mono" x="372" y="159">Path: /images/*</text>

  <rect class="dg-node" x="364" y="176" width="184" height="46" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="372" y="194">우선순위 30</text>
  <text class="dg-fs-sm dg-mono" x="372" y="213">Header: X-Beta=true</text>

  <rect class="dg-node dg-node--alt" x="364" y="230" width="184" height="46" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="372" y="248">기본 규칙 — 항상 마지막</text>
  <text class="dg-fs-sm dg-mono" x="372" y="267">default</text>

  <rect class="dg-node" x="580" y="68" width="120" height="46" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="640" y="96" text-anchor="middle">tg-api</text>
  <rect class="dg-node" x="580" y="122" width="120" height="46" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="640" y="150" text-anchor="middle">tg-static</text>
  <rect class="dg-node" x="580" y="176" width="120" height="46" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="640" y="204" text-anchor="middle">tg-beta</text>
  <rect class="dg-node" x="580" y="230" width="120" height="46" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="640" y="258" text-anchor="middle">tg-web</text>

  <path class="dg-edge" d="M552 91 L576 91" marker-end="url(#d061-ar)"/>
  <path class="dg-edge" d="M552 145 L576 145" marker-end="url(#d061-ar)"/>
  <path class="dg-edge" d="M552 199 L576 199" marker-end="url(#d061-ar)"/>
  <path class="dg-edge" d="M552 253 L576 253" marker-end="url(#d061-ar)"/>

  <text class="dg-fs-sm dg-muted" x="640" y="298" text-anchor="middle">타깃 그룹</text>

  <rect class="dg-node dg-node--accent" x="20" y="316" width="680" height="78" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="340" text-anchor="middle">우선순위 번호가 낮은 규칙부터 평가하고, 처음 일치하는 규칙에서 멈춥니다</text>
  <text class="dg-fs-sm" x="360" y="362" text-anchor="middle">같은 규칙 집합이라도 번호를 바꾸면 요청이 도착하는 타깃 그룹이 달라집니다</text>
  <text class="dg-fs-sm" x="360" y="384" text-anchor="middle">타깃 그룹은 등록된 대상 가운데 헬스체크를 통과한 대상에만 요청을 보냅니다</text>
</svg>
