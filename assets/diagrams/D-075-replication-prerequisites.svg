<svg viewBox="0 0 720 440" role="img" aria-labelledby="d075-title d075-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d075-title">S3 복제의 전제 조건과 세 가지 제약</title>
  <desc id="d075-desc">왼쪽 원본 버킷에서 오른쪽 대상 버킷으로 객체가 복제되는 흐름입니다.
    양쪽 버킷 모두 버전 관리가 켜져 있어야 하며 한쪽이라도 꺼져 있으면 복제 규칙을 만들 수 없습니다.
    원본 버킷 안에는 규칙을 만들기 전부터 있던 객체와 규칙을 만든 뒤 올라온 객체가 있는데,
    자동으로 대상에 도착하는 것은 규칙 생성 이후의 객체뿐입니다.
    기존 객체를 옮기려면 S3 Batch Operations 의 배치 복제를 따로 실행해야 합니다.
    세 번째 제약은 삭제 마커 전파이며 DeleteMarkerReplication 은 기본이 비활성이라
    원본에서 객체를 지워도 대상에는 삭제 마커가 생기지 않습니다.
    같은 리전이면 SRR, 다른 리전이면 CRR 이라 부르지만 이 세 제약은 양쪽 모두에 똑같이 적용됩니다.</desc>

  <defs>
    <marker id="d075-ar-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--ok" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d075-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="28">복제는 버전 관리 위에서만 동작합니다</text>

  <!-- 원본 버킷 -->
  <rect class="dg-node" x="20" y="44" width="270" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="34" y="68">원본 버킷</text>
  <rect x="176" y="52" width="100" height="22" rx="4"
        fill="var(--dg-ok-soft)" stroke="var(--dg-ok)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="226" y="68" text-anchor="middle">버전 관리 ON</text>

  <rect class="dg-node dg-node--muted" x="34" y="86" width="242" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="46" y="104">규칙 생성 이전 객체</text>
  <text class="dg-fs-sm dg-muted" x="46" y="121">이미 버킷에 있던 것들</text>

  <rect class="dg-node dg-node--ok" x="34" y="136" width="242" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="46" y="154">규칙 생성 이후 객체</text>
  <text class="dg-fs-sm dg-muted" x="46" y="171">새로 올라온 것들</text>

  <!-- 복제 경로 -->
  <text class="dg-fs-sm dg-bold" x="360" y="60" text-anchor="middle">복제 규칙</text>
  <text class="dg-fs-sm dg-muted" x="360" y="78" text-anchor="middle">같은 리전 = SRR</text>
  <text class="dg-fs-sm dg-muted" x="360" y="94" text-anchor="middle">다른 리전 = CRR</text>

  <path class="dg-edge dg-edge--dashed dg-edge--muted" d="M280 107 L340 107"/>
  <path class="dg-x" d="M348 100 L362 114 M362 100 L348 114"/>
  <text class="dg-fs-sm dg-bold" x="372" y="112">자동 복제 안 됨</text>

  <path class="dg-edge dg-edge--ok" d="M280 157 L426 157" marker-end="url(#d075-ar-ok)"/>
  <text class="dg-fs-sm dg-bold" x="353" y="150" text-anchor="middle">비동기 복제</text>

  <!-- 대상 버킷 -->
  <rect class="dg-node" x="430" y="44" width="270" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="444" y="68">대상 버킷</text>
  <rect x="586" y="52" width="100" height="22" rx="4"
        fill="var(--dg-ok-soft)" stroke="var(--dg-ok)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="636" y="68" text-anchor="middle">버전 관리 ON</text>

  <rect class="dg-node dg-node--empty" x="444" y="86" width="242" height="42" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="456" y="104">비어 있습니다</text>
  <text class="dg-fs-sm dg-muted" x="456" y="121">배치 복제를 실행해야 채워집니다</text>

  <rect class="dg-node dg-node--ok" x="444" y="136" width="242" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="456" y="154">규칙 생성 이후 객체</text>
  <text class="dg-fs-sm dg-muted" x="456" y="171">여기만 자동으로 채워집니다</text>

  <!-- 제약 3종 -->
  <text class="dg-fs-md dg-bold" x="20" y="224">외우면 되는 제약 세 가지</text>

  <rect class="dg-node dg-node--accent" x="20" y="236" width="218" height="112" rx="4"/>
  <circle cx="42" cy="260" r="11" fill="var(--dg-accent-soft)" stroke="var(--dg-accent)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="42" y="265" text-anchor="middle">1</text>
  <text class="dg-fs-sm dg-bold" x="60" y="265">버전 관리 필수</text>
  <text class="dg-fs-sm" x="34" y="290">원본과 대상 양쪽 모두</text>
  <text class="dg-fs-sm" x="34" y="308">켜져 있어야 합니다.</text>
  <text class="dg-fs-sm dg-muted" x="34" y="330">하나라도 꺼져 있으면 규칙</text>
  <text class="dg-fs-sm dg-muted" x="34" y="344">생성 자체가 거부됩니다</text>

  <rect class="dg-node" x="251" y="236" width="218" height="112" rx="4"/>
  <circle cx="273" cy="260" r="11" fill="var(--dg-fill-alt)" stroke="var(--dg-stroke)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="273" y="265" text-anchor="middle">2</text>
  <text class="dg-fs-sm dg-bold" x="291" y="265">기존 객체는 제외</text>
  <text class="dg-fs-sm" x="265" y="290">규칙을 만들기 전에 있던</text>
  <text class="dg-fs-sm" x="265" y="308">객체는 옮겨지지 않습니다.</text>
  <text class="dg-fs-sm dg-muted" x="265" y="330">S3 Batch Operations 의</text>
  <text class="dg-fs-sm dg-muted" x="265" y="344">배치 복제를 따로 실행합니다</text>

  <rect class="dg-node" x="482" y="236" width="218" height="112" rx="4"/>
  <circle cx="504" cy="260" r="11" fill="var(--dg-fill-alt)" stroke="var(--dg-stroke)" stroke-width="var(--dg-sw-1)"/>
  <text class="dg-fs-sm dg-bold" x="504" y="265" text-anchor="middle">3</text>
  <text class="dg-fs-sm dg-bold" x="522" y="265">삭제 마커는 선택</text>
  <text class="dg-fs-sm" x="496" y="290">DeleteMarkerReplication</text>
  <text class="dg-fs-sm" x="496" y="308">은 기본이 비활성입니다.</text>
  <text class="dg-fs-sm dg-muted" x="496" y="330">원본에서 지워도 대상에는</text>
  <text class="dg-fs-sm dg-muted" x="496" y="344">삭제 마커가 생기지 않습니다</text>

  <!-- 결론 -->
  <rect class="dg-node dg-node--accent" x="20" y="360" width="680" height="62" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="384" text-anchor="middle">"복제를 켰는데 예전 파일이 안 보인다"는 고장이 아니라 설계입니다</text>
  <text class="dg-fs-sm" x="360" y="406" text-anchor="middle">복제는 규칙이 생긴 뒤의 쓰기에만 반응합니다 — 과거는 배치 복제의 몫입니다</text>
</svg>
