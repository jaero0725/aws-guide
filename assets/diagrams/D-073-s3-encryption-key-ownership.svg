<svg viewBox="0 0 720 420" role="img" aria-labelledby="d073-title d073-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d073-title">S3 암호화 네 가지의 키 관리 주체 비교</title>
  <desc id="d073-desc">SSE-S3, SSE-KMS, SSE-C, 클라이언트 측 암호화를 네 개의 열에 놓고
    키를 누가 만드는가, 키가 어디에 저장되는가, 요청마다 키를 보내야 하는가,
    키 사용 호출이 AWS CloudTrail 에 기록되는가를 비교합니다.
    SSE-S3 는 AWS 가 키를 만들고 S3 내부에 두며 키 사용 기록이 남지 않습니다.
    SSE-KMS 는 AWS KMS 에 있는 키를 쓰고 Decrypt 와 GenerateDataKey 호출이 CloudTrail 에 그대로 남으므로
    누가 언제 어떤 객체를 복호화했는지 추적할 수 있고 키 정책으로 권한을 따로 나눌 수 있습니다.
    SSE-C 는 고객이 키를 보관하고 요청마다 HTTPS 로 키를 보내며 S3 는 키를 저장하지 않습니다.
    클라이언트 측 암호화는 데이터가 S3 에 닿기 전에 이미 암호문이라 S3 는 평문을 본 적이 없습니다.
    "키 사용을 감사해야 한다" 또는 "키를 직접 회전하고 접근 권한을 따로 통제해야 한다"는 요구는
    강조된 SSE-KMS 열을 가리킵니다.</desc>

  <text class="dg-fs-md dg-bold" x="20" y="26">키는 어디에 있고, 누가 만들고, 사용 기록이 남는가</text>

  <path class="dg-grid" d="M162 50 L563 50 M162 50 L162 56 M563 50 L563 56"/>
  <text class="dg-fs-sm dg-muted" x="362" y="44" text-anchor="middle">서버 측 암호화 — S3 가 복호화합니다</text>
  <text class="dg-fs-sm dg-muted" x="632" y="44" text-anchor="middle">클라이언트 측</text>

  <rect class="dg-node dg-node--empty" x="20" y="56" width="680" height="270" rx="4"/>
  <rect class="dg-node dg-node--accent" x="295" y="56" width="135" height="270" rx="4"/>

  <path class="dg-grid" d="M20 96 L700 96 M20 142 L700 142 M20 188 L700 188
                            M20 234 L700 234 M20 280 L700 280
                            M160 56 L160 326 M565 56 L565 326"/>

  <!-- 헤더 -->
  <text class="dg-fs-md dg-bold" x="228" y="82" text-anchor="middle">SSE-S3</text>
  <text class="dg-fs-md dg-bold" x="362" y="82" text-anchor="middle">SSE-KMS</text>
  <text class="dg-fs-md dg-bold" x="498" y="82" text-anchor="middle">SSE-C</text>
  <text class="dg-fs-md dg-bold" x="632" y="76" text-anchor="middle">클라이언트 측</text>
  <text class="dg-fs-sm dg-muted" x="632" y="92" text-anchor="middle">CSE</text>
  <text class="dg-fs-sm dg-muted" x="28" y="82">비교 항목</text>

  <!-- 1. 키를 만드는 주체 -->
  <text class="dg-fs-sm dg-bold" x="28" y="116">키를 만드는</text>
  <text class="dg-fs-sm dg-bold" x="28" y="134">주체</text>
  <text class="dg-fs-sm" x="228" y="125" text-anchor="middle">AWS</text>
  <text class="dg-fs-sm dg-bold" x="362" y="116" text-anchor="middle">고객 또는 AWS</text>
  <text class="dg-fs-sm dg-muted" x="362" y="134" text-anchor="middle">KMS 키</text>
  <text class="dg-fs-sm" x="498" y="125" text-anchor="middle">고객</text>
  <text class="dg-fs-sm" x="632" y="125" text-anchor="middle">고객</text>

  <!-- 2. 키가 있는 곳 -->
  <text class="dg-fs-sm dg-bold" x="28" y="162">키가 저장되는</text>
  <text class="dg-fs-sm dg-bold" x="28" y="180">곳</text>
  <text class="dg-fs-sm" x="228" y="162" text-anchor="middle">S3 서비스</text>
  <text class="dg-fs-sm" x="228" y="180" text-anchor="middle">내부</text>
  <text class="dg-fs-sm dg-bold" x="362" y="171" text-anchor="middle">AWS KMS</text>
  <text class="dg-fs-sm" x="498" y="162" text-anchor="middle">고객 쪽</text>
  <text class="dg-fs-sm dg-muted" x="498" y="180" text-anchor="middle">S3 는 저장 안 함</text>
  <text class="dg-fs-sm" x="632" y="162" text-anchor="middle">고객 쪽</text>
  <text class="dg-fs-sm dg-muted" x="632" y="180" text-anchor="middle">또는 KMS</text>

  <!-- 3. 요청마다 키 전달 -->
  <text class="dg-fs-sm dg-bold" x="28" y="208">요청마다 키를</text>
  <text class="dg-fs-sm dg-bold" x="28" y="226">보내는가</text>
  <text class="dg-fs-sm" x="228" y="217" text-anchor="middle">아니오</text>
  <text class="dg-fs-sm" x="362" y="208" text-anchor="middle">아니오</text>
  <text class="dg-fs-sm dg-muted" x="362" y="226" text-anchor="middle">키 ID 만 지정</text>
  <text class="dg-fs-sm dg-bold" x="498" y="208" text-anchor="middle">예 — 매 요청</text>
  <text class="dg-fs-sm dg-muted" x="498" y="226" text-anchor="middle">HTTPS 필수</text>
  <text class="dg-fs-sm" x="632" y="208" text-anchor="middle">아니오</text>
  <text class="dg-fs-sm dg-muted" x="632" y="226" text-anchor="middle">이미 암호문</text>

  <!-- 4. CloudTrail -->
  <text class="dg-fs-sm dg-bold" x="28" y="254">키 사용이</text>
  <text class="dg-fs-sm dg-bold" x="28" y="272">CloudTrail 에</text>
  <text class="dg-fs-sm dg-muted" x="228" y="263" text-anchor="middle">남지 않음</text>
  <text class="dg-fs-sm dg-bold" x="362" y="254" text-anchor="middle">남습니다</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="362" y="272" text-anchor="middle">Decrypt</text>
  <text class="dg-fs-sm dg-muted" x="498" y="263" text-anchor="middle">남지 않음</text>
  <text class="dg-fs-sm dg-muted" x="632" y="254" text-anchor="middle">S3 는 모름</text>
  <text class="dg-fs-sm dg-muted" x="632" y="272" text-anchor="middle">(KMS 쓰면 남음)</text>

  <!-- 5. 판별 단서 -->
  <text class="dg-fs-sm dg-bold" x="28" y="309">판별 단서</text>
  <text class="dg-fs-sm" x="228" y="300" text-anchor="middle">기본값 그대로</text>
  <text class="dg-fs-sm dg-muted" x="228" y="318" text-anchor="middle">손댈 것 없음</text>
  <text class="dg-fs-sm dg-bold" x="362" y="300" text-anchor="middle">감사 · 회전</text>
  <text class="dg-fs-sm dg-bold" x="362" y="318" text-anchor="middle">권한 분리</text>
  <text class="dg-fs-sm" x="498" y="300" text-anchor="middle">키를 AWS 에</text>
  <text class="dg-fs-sm" x="498" y="318" text-anchor="middle">맡길 수 없음</text>
  <text class="dg-fs-sm" x="632" y="300" text-anchor="middle">전송 전부터</text>
  <text class="dg-fs-sm" x="632" y="318" text-anchor="middle">암호화 필요</text>

  <!-- 결론 -->
  <rect class="dg-node dg-node--accent" x="20" y="340" width="680" height="62" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="364" text-anchor="middle">"키 사용을 감사해야 한다" · "키를 직접 회전한다" · "복호화 권한을 따로 나눈다"</text>
  <text class="dg-fs-md dg-bold" x="360" y="388" text-anchor="middle">세 요구는 전부 SSE-KMS 로 수렴합니다</text>
</svg>
