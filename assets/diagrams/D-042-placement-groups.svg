  <text class="dg-fs-sm" x="642" y="223" text-anchor="middle">인스턴스</text>

  <text class="dg-fs-sm" x="126" y="284" text-anchor="middle">랙 하나가 죽으면 전부</text>
  <text class="dg-fs-sm" x="360" y="284" text-anchor="middle">랙 하나가 죽으면 한 파티션만</text>
  <text class="dg-fs-sm" x="594" y="284" text-anchor="middle">랙 하나가 죽으면 하나만</text>

  <path class="dg-grid" d="M20 306 L700 306"/>
  <text class="dg-fs-sm dg-bold" x="20" y="332">← 네트워크 지연이 낮다 (성능 최적화)</text>
  <text class="dg-fs-sm dg-bold" x="700" y="332" text-anchor="end">장애 격리가 강하다 →</text>

  <rect class="dg-node dg-node--accent" x="20" y="346" width="680" height="56" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="370" text-anchor="middle">성능 최적화와 장애 격리는 서로 반대 방향입니다</text>
  <text class="dg-fs-sm" x="360" y="392" text-anchor="middle">HPC 처럼 노드 간 지연이 중요하면 클러스터, 가용성이 중요하면 파티션이나 분산을 고릅니다</text>
