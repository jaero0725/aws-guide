  <rect class="dg-node dg-node--accent" x="44" y="146" width="76" height="38" rx="3"/>
  <text class="dg-fs-sm" x="82" y="170" text-anchor="middle">인스턴스</text>
  <rect class="dg-node dg-node--accent" x="128" y="146" width="76" height="38" rx="3"/>
  <text class="dg-fs-sm" x="166" y="170" text-anchor="middle">인스턴스</text>
  <rect class="dg-node dg-node--empty" x="34" y="204" width="184" height="46" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="126" y="224" text-anchor="middle">랙 2 — 사용 안 함</text>
  <text class="dg-fs-sm dg-muted" x="126" y="242" text-anchor="middle">근접이 목적</text>

  <!-- 파티션 -->
