<svg viewBox="0 0 720 420" role="img" aria-labelledby="d042-title d042-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d042-title">배치 그룹 3종의 장애 도메인</title>
  <desc id="d042-desc">같은 랙 그림 위에 세 가지 배치 그룹 전략을 나란히 놓았습니다.
    클러스터 배치 그룹은 하나의 가용 영역 안에서 인스턴스를 물리적으로 가깝게 모아 네트워크 지연을 최소화하지만
    같은 랙을 공유하므로 랙 하나가 죽으면 전부 함께 죽습니다.
    파티션 배치 그룹은 인스턴스를 파티션 단위로 묶고 파티션마다 서로 다른 랙에 배치하므로
    랙 하나가 죽어도 한 파티션만 잃습니다. 분산 시스템의 복제본 배치에 맞습니다.
    분산 배치 그룹은 인스턴스마다 랙을 완전히 분리하므로 장애 격리가 가장 강하지만 한 그룹에 넣을 수 있는 수가 제한됩니다.
    아래 축이 결론입니다. 네트워크 성능 최적화와 장애 격리는 서로 반대 방향으로 움직입니다.</desc>

  <text class="dg-fs-md dg-bold" x="126" y="30" text-anchor="middle">클러스터</text>
  <text class="dg-fs-md dg-bold" x="360" y="30" text-anchor="middle">파티션</text>
  <text class="dg-fs-md dg-bold" x="594" y="30" text-anchor="middle">분산</text>
  <text class="dg-fs-sm dg-muted" x="126" y="50" text-anchor="middle">한 AZ 안에 근접 배치</text>
  <text class="dg-fs-sm dg-muted" x="360" y="50" text-anchor="middle">파티션마다 다른 랙</text>
  <text class="dg-fs-sm dg-muted" x="594" y="50" text-anchor="middle">인스턴스마다 다른 하드웨어</text>

  <!-- 클러스터 -->
  <rect class="dg-panel" x="20" y="62" width="212" height="200" rx="4"/>
  <rect class="dg-node dg-node--alt" x="34" y="76" width="184" height="120" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="44" y="94">랙 1</text>
  <rect class="dg-node dg-node--accent" x="44" y="102" width="76" height="38" rx="3"/>
  <text class="dg-fs-sm" x="82" y="126" text-anchor="middle">인스턴스</text>
