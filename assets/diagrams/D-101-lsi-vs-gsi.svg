<svg viewBox="0 0 720 506" role="img" aria-labelledby="d101-title d101-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d101-title">LSI와 GSI의 구조 차이</title>
  <desc id="d101-desc">왼쪽 로컬 보조 인덱스는 기본 테이블과 파티션 키를 공유합니다.
    인덱스 항목이 테이블 항목과 같은 파티션 안에 자리 잡기 때문에 정렬 키만 다른 또 하나의 정렬 순서를 얻는 셈이고,
    읽기와 쓰기 용량도 테이블 것을 함께 씁니다. 대신 파티션 키 값 하나당 10 GB 라는 크기 제한이 생기고
    테이블을 만들 때만 정의할 수 있어 나중에 추가하거나 지울 수 없습니다. 최대 5개입니다.
    오른쪽 글로벌 보조 인덱스는 파티션 키를 테이블과 다르게 잡을 수 있고 자기만의 파티션 공간을 갖습니다.
    테이블에 쓰기가 일어나면 인덱스로 비동기 전파되며, 읽기와 쓰기 용량을 테이블과 별도로 설정하므로
    인덱스 쪽 스로틀링이 테이블과 독립적으로 발생합니다. 크기 제한이 없고 언제든 추가하거나 삭제할 수 있으며 최대 20개입니다.
    이미 운영 중인 테이블에 새 조회 패턴을 붙여야 한다는 시나리오의 답은 항상 GSI 입니다.</desc>

  <defs>
    <marker id="d101-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="26">파티션 공간을 공유하는가, 따로 갖는가</text>

  <!-- LSI -->
  <rect class="dg-panel" x="20" y="40" width="330" height="212" rx="4"/>
  <text class="dg-fs-md dg-bold" x="34" y="64">LSI — 로컬 보조 인덱스</text>

  <rect class="dg-node dg-node--alt" x="34" y="76" width="302" height="124" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="185" y="98" text-anchor="middle">같은 파티션 — 파티션 키 = A</text>

  <rect class="dg-node" x="46" y="110" width="136" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="114" y="136" text-anchor="middle">기본 테이블</text>
  <text class="dg-fs-sm dg-mono" x="114" y="158" text-anchor="middle">SK = 날짜</text>
  <text class="dg-fs-sm dg-muted" x="114" y="178" text-anchor="middle">항목</text>

  <rect class="dg-node dg-node--accent" x="192" y="110" width="132" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="258" y="136" text-anchor="middle">LSI</text>
  <text class="dg-fs-sm dg-mono" x="258" y="158" text-anchor="middle">SK = 상태</text>
  <text class="dg-fs-sm dg-muted" x="258" y="178" text-anchor="middle">같은 자리에</text>

  <text class="dg-fs-sm" x="34" y="222">파티션 키를 테이블과 다르게 잡을 수 없습니다</text>
  <text class="dg-fs-sm dg-bold" x="34" y="242">테이블의 읽기·쓰기 용량을 함께 씁니다</text>

  <!-- GSI -->
  <rect class="dg-panel" x="370" y="40" width="330" height="212" rx="4"/>
  <text class="dg-fs-md dg-bold" x="384" y="64">GSI — 글로벌 보조 인덱스</text>

  <rect class="dg-node dg-node--alt" x="384" y="76" width="142" height="124" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="455" y="98" text-anchor="middle">파티션 키 = A</text>
  <rect class="dg-node" x="394" y="110" width="122" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="455" y="140" text-anchor="middle">기본 테이블</text>
  <text class="dg-fs-sm dg-muted" x="455" y="162" text-anchor="middle">항목</text>

  <path class="dg-edge dg-edge--dashed" d="M526 149 L544 149" marker-end="url(#d101-ar)"/>

  <rect class="dg-node dg-node--alt" x="548" y="76" width="138" height="124" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="617" y="98" text-anchor="middle">파티션 키 = B</text>
  <rect class="dg-node dg-node--accent" x="558" y="110" width="118" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="617" y="140" text-anchor="middle">GSI</text>
  <text class="dg-fs-sm dg-muted" x="617" y="162" text-anchor="middle">자기 공간</text>

  <text class="dg-fs-sm" x="384" y="222">쓰기가 인덱스로 비동기 전파됩니다</text>
  <text class="dg-fs-sm dg-bold" x="384" y="242">읽기·쓰기 용량을 따로 설정합니다</text>

  <!-- 비교표 -->
  <rect class="dg-node dg-node--empty" x="20" y="266" width="680" height="180" rx="4"/>
  <path class="dg-grid" d="M20 296 L700 296 M20 326 L700 326 M20 356 L700 356
                            M20 386 L700 386 M20 416 L700 416
                            M250 266 L250 446 M475 266 L475 446"/>

  <text class="dg-fs-sm dg-muted" x="30" y="287">항목</text>
  <text class="dg-fs-sm dg-bold" x="260" y="287">LSI</text>
  <text class="dg-fs-sm dg-bold" x="485" y="287">GSI</text>

  <text class="dg-fs-sm dg-bold" x="30" y="317">파티션 키</text>
  <text class="dg-fs-sm" x="260" y="317">테이블과 동일해야 합니다</text>
  <text class="dg-fs-sm" x="485" y="317">아무 속성이나 쓸 수 있습니다</text>

  <text class="dg-fs-sm dg-bold" x="30" y="347">최대 개수</text>
  <text class="dg-fs-sm dg-bold dg-num" x="260" y="347">5개</text>
  <text class="dg-fs-sm dg-bold dg-num" x="485" y="347">20개</text>

  <text class="dg-fs-sm dg-bold" x="30" y="377">크기 제약</text>
  <text class="dg-fs-sm dg-bold" x="260" y="377">파티션 키 값당 10 GB</text>
  <text class="dg-fs-sm" x="485" y="377">제한 없음</text>

  <text class="dg-fs-sm dg-bold" x="30" y="407">용량</text>
  <text class="dg-fs-sm" x="260" y="407">테이블 용량을 공유</text>
  <text class="dg-fs-sm dg-bold" x="485" y="407">자체 용량 설정</text>

  <text class="dg-fs-sm dg-bold" x="30" y="437">만드는 시점</text>
  <text class="dg-fs-sm" x="260" y="437">테이블 생성 시에만</text>
  <text class="dg-fs-sm dg-bold" x="485" y="437">언제든 추가 · 삭제</text>

  <!-- 결론 -->
  <rect class="dg-node dg-node--accent" x="20" y="458" width="680" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="483" text-anchor="middle">"이미 운영 중인 테이블에 새 조회 패턴을 추가해야 한다" — 답은 언제나 GSI 입니다</text>
</svg>
