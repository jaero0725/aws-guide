<svg viewBox="0 0 720 700" role="img" aria-labelledby="d011-title d011-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d011-title">IAM 정책 평가 순서 흐름도</title>
  <desc id="d011-desc">하나의 API 요청이 최종 결정에 이르기까지 거치는 관문을 위에서 아래로 그린 흐름도입니다.
    모든 요청은 기본적으로 암묵적으로 거부된 상태에서 출발합니다. 첫 관문에서 정책 유형을 통틀어 명시적 Deny 를 찾고,
    하나라도 있으면 나머지를 보지 않고 즉시 거부합니다. 이어서 Organizations SCP 의 상한, 리소스 기반 정책,
    권한 경계, 세션 정책, 자격 증명 기반 정책을 차례로 평가하며, 어느 한 관문이라도 허용하지 않으면
    오른쪽 거부 레일을 따라 최종 거부로 빠집니다. 리소스 기반 정책이 명시적으로 허용하면 동일 계정 주체는
    왼쪽 지름길을 따라 곧바로 최종 허용에 도달합니다. 결론은 명시적 거부가 명시적 허용을 이기고,
    명시적 허용이 기본값인 암묵적 거부를 이긴다는 우선순위입니다.</desc>

  <defs>
    <marker id="d011-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d011-ar-danger" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--danger" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d011-ar-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--ok" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text data-dg="verdict" class="dg-fs-sm dg-muted" x="360" y="24" text-anchor="middle">기본값은 암묵적 거부입니다 — 명시적 Allow 가 있어야만 통과합니다</text>

  <!-- ============ 메인 평가 컬럼 (x 130..430) ============ -->
  <g data-dg="step-request">
    <rect class="dg-node dg-node--alt" x="130" y="40" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="62" text-anchor="middle">API 요청 도착</text>
    <text class="dg-fs-sm dg-muted" x="280" y="81" text-anchor="middle">Principal · Action · Resource · Condition</text>
  </g>

  <g data-dg="gate-deny">
    <rect class="dg-node" x="130" y="124" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="146" text-anchor="middle">1. 명시적 Deny 가 있는가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="165" text-anchor="middle">모든 정책 유형을 통틀어 먼저 검사</text>
  </g>

  <g data-dg="gate-scp">
    <rect class="dg-node" x="130" y="208" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="230" text-anchor="middle">2. SCP 가 허용하는가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="249" text-anchor="middle">상한만 정함 · 루트 사용자에도 적용</text>
  </g>

  <g data-dg="gate-resource">
    <rect class="dg-node" x="130" y="292" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="314" text-anchor="middle">3. 리소스 기반 정책이 Allow 인가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="333" text-anchor="middle">동일 계정이면 여기서 허용될 수 있음</text>
  </g>

  <g data-dg="gate-boundary">
    <rect class="dg-node" x="130" y="376" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="398" text-anchor="middle">4. 권한 경계가 허용하는가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="417" text-anchor="middle">자격 증명 기반 정책과 교집합</text>
  </g>

  <g data-dg="gate-session">
    <rect class="dg-node" x="130" y="460" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="482" text-anchor="middle">5. 세션 정책이 허용하는가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="501" text-anchor="middle">AssumeRole 호출 시 전달한 정책</text>
  </g>

  <g data-dg="gate-identity">
    <rect class="dg-node" x="130" y="544" width="300" height="54" rx="4"/>
    <text class="dg-fs-md dg-bold" x="280" y="566" text-anchor="middle">6. 자격 증명 기반 정책이 Allow 인가</text>
    <text class="dg-fs-sm dg-muted" x="280" y="585" text-anchor="middle">사용자 · 그룹 · 역할에 붙은 정책</text>
  </g>

  <!-- 메인 흐름 (강조 경로) -->
  <path data-dg="flow-1" class="dg-edge dg-edge--accent" d="M280 94 L280 120" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-2" class="dg-edge dg-edge--accent" d="M280 178 L280 204" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-3" class="dg-edge dg-edge--accent" d="M280 262 L280 288" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-4" class="dg-edge dg-edge--accent" d="M280 346 L280 372" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-5" class="dg-edge dg-edge--accent" d="M280 430 L280 456" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-6" class="dg-edge dg-edge--accent" d="M280 514 L280 540" marker-end="url(#d011-ar)"/>
  <path data-dg="flow-7" class="dg-edge dg-edge--accent" d="M280 598 L280 624" marker-end="url(#d011-ar)"/>

  <text class="dg-fs-sm" x="290" y="197">아니오</text>
  <text class="dg-fs-sm" x="290" y="281">예</text>
  <text class="dg-fs-sm" x="290" y="365">Allow 없음</text>
  <text class="dg-fs-sm" x="290" y="449">예</text>
  <text class="dg-fs-sm" x="290" y="533">예</text>
  <text class="dg-fs-sm" x="290" y="617">예</text>

  <!-- ============ 거부 레일 (오른쪽) ============ -->
  <path data-dg="deny-explicit" class="dg-edge dg-edge--danger dg-edge--dashed" d="M430 151 L580 151"/>
  <path data-dg="deny-scp" class="dg-edge dg-edge--danger dg-edge--dashed" d="M430 235 L580 235"/>
  <path data-dg="deny-boundary" class="dg-edge dg-edge--danger dg-edge--dashed" d="M430 403 L580 403"/>
  <path data-dg="deny-session" class="dg-edge dg-edge--danger dg-edge--dashed" d="M430 487 L580 487"/>
  <path data-dg="deny-identity" class="dg-edge dg-edge--danger dg-edge--dashed" d="M430 571 L580 571"/>
  <path data-dg="deny-rail" class="dg-edge dg-edge--danger" d="M580 151 L580 620" marker-end="url(#d011-ar-danger)"/>

  <circle cx="580" cy="235" r="3.5" fill="var(--dg-danger)"/>
  <circle cx="580" cy="403" r="3.5" fill="var(--dg-danger)"/>
  <circle cx="580" cy="487" r="3.5" fill="var(--dg-danger)"/>
  <circle cx="580" cy="571" r="3.5" fill="var(--dg-danger)"/>

  <text class="dg-fs-sm" x="436" y="144">예 · 즉시 거부</text>
  <text class="dg-fs-sm" x="436" y="228">아니오 · 상한 밖</text>
  <text class="dg-fs-sm" x="436" y="396">아니오 · 경계 밖</text>
  <text class="dg-fs-sm" x="436" y="480">아니오 · 세션 밖</text>
  <text class="dg-fs-sm" x="436" y="564">아니오 · 암묵 거부</text>

  <!-- ============ 허용 지름길 (왼쪽) ============ -->
  <path data-dg="allow-shortcut" class="dg-edge dg-edge--ok dg-edge--dashdot"
        d="M130 319 L65 319 L65 656 L96 656" marker-end="url(#d011-ar-ok)"/>
  <text class="dg-fs-sm" x="126" y="311" text-anchor="end">예 · 지름길</text>

  <!-- ============ 최종 결정 ============ -->
  <g data-dg="final-allow">
    <rect class="dg-node dg-node--ok" x="100" y="628" width="330" height="56" rx="4"/>
    <text class="dg-fs-lg dg-bold" x="265" y="653" text-anchor="middle">최종 결정: 허용</text>
    <text class="dg-fs-sm" x="265" y="673" text-anchor="middle">명시적 Allow 가 있고 어떤 Deny 에도 걸리지 않음</text>
  </g>

  <g data-dg="final-deny">
    <rect class="dg-node dg-node--danger" x="450" y="628" width="260" height="56" rx="4"/>
    <text class="dg-fs-lg dg-bold" x="580" y="653" text-anchor="middle">최종 결정: 거부</text>
    <text class="dg-fs-sm" x="580" y="673" text-anchor="middle">명시적 Deny 또는 Allow 없음</text>
  </g>
</svg>
