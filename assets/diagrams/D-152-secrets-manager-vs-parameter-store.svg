<svg viewBox="0 0 720 522" role="img" aria-labelledby="d152-title d152-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d152-title">AWS Secrets Manager 와 Parameter Store 의 대비</title>
  <desc id="d152-desc">왼쪽은 AWS Secrets Manager 입니다. 비밀에 교체 Lambda 함수를 붙여 두면 정해진 주기마다 새 값이 만들어져
    AWSPENDING 준비 라벨을 달고, 검증이 끝나면 AWSCURRENT 로 승격되어 순환합니다. 교체가 실패해도 현재 값이 살아 있습니다.
    오른쪽은 AWS Systems Manager Parameter Store 입니다. 파라미터 이름을 슬래시로 나눈 경로처럼 계층화해 설정값을 정리하고
    값 유형은 String, StringList, SecureString 세 가지이며, 자동 교체 기능 자체가 없어 새 값을 넣는 일은 사용자 몫입니다.
    그 지점을 가위표로 표시했습니다.
    아래 비교표는 주 용도, 자동 교체, 교체 동작, 계층, 비용 성격, 문제문에서 고르는 신호 여섯 항목을 나란히 놓습니다.
    결론은 자격 증명을 주기적으로 자동 교체하라는 요구가 Secrets Manager 한쪽만 지목한다는 것이며,
    교체 요구가 없고 추가 비용을 들이지 않아야 한다면 Parameter Store 가 답입니다.</desc>

  <defs>
    <marker id="d152-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d152-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- 좌 · Secrets Manager -->
  <rect class="dg-panel" x="20" y="34" width="330" height="200" rx="4"/>
  <text class="dg-fs-md dg-bold" x="34" y="26">AWS Secrets Manager</text>
  <text class="dg-fs-sm dg-muted" x="34" y="54">교체가 내장된 비밀 저장소</text>

  <rect class="dg-node dg-node--accent" x="36" y="66" width="140" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="106" y="92" text-anchor="middle">비밀 (Secret)</text>
  <path class="dg-edge dg-edge--accent" d="M180 87 L192 87" marker-end="url(#d152-ar-accent)"/>
  <rect class="dg-node dg-node--accent" x="196" y="66" width="140" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="266" y="92" text-anchor="middle">교체 Lambda</text>

  <path class="dg-edge dg-edge--accent" d="M266 112 L266 132" marker-end="url(#d152-ar-accent)"/>
  <rect class="dg-node" x="196" y="136" width="140" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="266" y="155" text-anchor="middle">새 버전</text>
  <text class="dg-fs-sm dg-mono" x="266" y="172" text-anchor="middle">AWSPENDING</text>

  <path class="dg-edge dg-edge--accent" d="M192 157 L180 157" marker-end="url(#d152-ar-accent)"/>
  <rect class="dg-node dg-node--ok" x="36" y="136" width="140" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="106" y="155" text-anchor="middle">승격</text>
  <text class="dg-fs-sm dg-mono" x="106" y="172" text-anchor="middle">AWSCURRENT</text>

  <path class="dg-edge dg-edge--accent dg-edge--dashed" d="M106 132 L106 112" marker-end="url(#d152-ar-accent)"/>
  <text class="dg-fs-sm dg-bold" x="34" y="204">정해진 주기마다 자동으로 순환합니다</text>
  <text class="dg-fs-sm dg-muted" x="34" y="224">교체가 실패해도 현재 값은 살아 있습니다</text>

  <!-- 우 · Parameter Store -->
  <rect class="dg-panel" x="370" y="34" width="330" height="200" rx="4"/>
  <text class="dg-fs-md dg-bold" x="384" y="26">Parameter Store</text>
  <text class="dg-fs-sm dg-muted" x="384" y="54">경로로 계층화하는 설정값 저장소</text>

  <text class="dg-fs-sm dg-mono dg-bold" x="392" y="86">/prod/orders/</text>
  <path class="dg-grid" d="M400 92 L400 152 M400 112 L418 112 M400 142 L418 142"/>
  <text class="dg-fs-sm dg-mono" x="424" y="117">db/password</text>
  <text class="dg-fs-sm dg-muted" x="546" y="117">SecureString</text>
  <text class="dg-fs-sm dg-mono" x="424" y="147">feature-flags/new</text>
  <text class="dg-fs-sm dg-muted" x="612" y="147">String</text>

  <rect class="dg-node dg-node--danger" x="386" y="164" width="298" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="420" y="190">자동 교체 기능이 없습니다</text>
  <path class="dg-x" d="M396 176 L410 190 M410 176 L396 190"/>
  <text class="dg-fs-sm dg-muted" x="384" y="224">새 값을 넣는 것은 사용자 몫입니다</text>

  <!-- 비교표 -->
  <rect class="dg-node dg-node--empty" x="20" y="250" width="680" height="210" rx="4"/>
  <path class="dg-grid" d="M20 280 L700 280 M20 310 L700 310 M20 340 L700 340 M20 370 L700 370
                            M20 400 L700 400 M20 430 L700 430
                            M200 250 L200 460 M450 250 L450 460"/>

  <text class="dg-fs-sm dg-muted" x="30" y="271">항목</text>
  <text class="dg-fs-sm dg-bold" x="210" y="271">Secrets Manager</text>
  <text class="dg-fs-sm dg-bold" x="460" y="271">Parameter Store</text>

  <text class="dg-fs-sm dg-bold" x="30" y="301">주 용도</text>
  <text class="dg-fs-sm" x="210" y="301">DB 자격 증명 · API 키</text>
  <text class="dg-fs-sm" x="460" y="301">설정값 · 파라미터</text>

  <text class="dg-fs-sm dg-bold" x="30" y="331">자동 교체</text>
  <text class="dg-fs-sm dg-bold" x="210" y="331">내장 — 교체 함수를 붙임</text>
  <text class="dg-fs-sm dg-bold" x="460" y="331">없음</text>

  <text class="dg-fs-sm dg-bold" x="30" y="361">교체 동작</text>
  <text class="dg-fs-sm dg-mono" x="210" y="361">AWSPENDING → AWSCURRENT</text>
  <text class="dg-fs-sm" x="460" y="361">해당 없음</text>

  <text class="dg-fs-sm dg-bold" x="30" y="391">계층</text>
  <text class="dg-fs-sm" x="210" y="391">비밀 단위</text>
  <text class="dg-fs-sm" x="460" y="391">이름을 경로로 계층화</text>

  <text class="dg-fs-sm dg-bold" x="30" y="421">비용 성격</text>
  <text class="dg-fs-sm" x="210" y="421">비밀 개수와 API 호출에 과금</text>
  <text class="dg-fs-sm" x="460" y="421">표준 계층은 추가 비용 없음</text>

  <text class="dg-fs-sm dg-bold" x="30" y="451">고르는 신호</text>
  <text class="dg-fs-sm" x="210" y="451">주기적으로 자동 교체</text>
  <text class="dg-fs-sm" x="460" y="451">설정값 · 비용을 더 안 들이고</text>

  <rect class="dg-node dg-node--accent" x="20" y="470" width="680" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="497" text-anchor="middle">문제문에 자동 교체나 회전이 보이면 Secrets Manager, 없으면 Parameter Store 입니다</text>
</svg>
