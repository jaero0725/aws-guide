<svg viewBox="0 0 720 330" role="img" aria-labelledby="d140-title d140-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d140-title">분석 파이프라인의 다섯 단계와 단계별 서비스</title>
  <desc id="d140-desc">데이터가 왼쪽에서 오른쪽으로 흐르는 다섯 칸의 지도입니다.
    첫째 칸은 수집입니다. Kinesis Data Streams 와 Amazon MSK 가 스트리밍 데이터를 받고 AWS DataSync 가 대량 파일을 옮깁니다.
    둘째 칸은 저장입니다. Amazon S3 가 데이터 레이크가 되어 원본을 가공하지 않은 상태로 보관합니다.
    셋째 칸은 카탈로그와 변환입니다. AWS Glue 의 크롤러가 스키마를 알아내 데이터 카탈로그에 등록하고 ETL 작업이 형식을 바꿉니다.
    넷째 칸은 조회입니다. Amazon Athena 는 S3 에 있는 데이터를 옮기지 않고 그 자리에서 SQL 로 조회하고,
    Amazon Redshift 는 데이터를 적재해 두고 웨어하우스로 반복 분석합니다.
    다섯째 칸은 시각화이며 Amazon QuickSight 가 대시보드를 만듭니다.
    서비스 이름만 죽 나열된 문항은 각 이름이 이 다섯 칸 가운데 어디에 속하는지로 환원해 읽습니다.</desc>

  <defs>
    <marker id="d140-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="26">데이터가 흐르는 다섯 단계</text>
  <path class="dg-edge dg-edge--accent" d="M20 44 L700 44" marker-end="url(#d140-ar-accent)"/>

  <!-- 1 수집 -->
  <rect class="dg-panel" x="20" y="56" width="124" height="194" rx="4"/>
  <rect class="dg-node dg-node--alt" x="20" y="56" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="82" y="81" text-anchor="middle">1 · 수집</text>
  <rect class="dg-node" x="20" y="104" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="82" y="122" text-anchor="middle">Kinesis</text>
  <text class="dg-fs-sm" x="82" y="138" text-anchor="middle">Data Streams</text>
  <rect class="dg-node" x="20" y="150" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="82" y="168" text-anchor="middle">Amazon MSK</text>
  <text class="dg-fs-sm" x="82" y="184" text-anchor="middle">Kafka 호환</text>
  <rect class="dg-node" x="20" y="196" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="82" y="214" text-anchor="middle">AWS DataSync</text>
  <text class="dg-fs-sm" x="82" y="230" text-anchor="middle">대량 파일 이동</text>

  <!-- 2 저장 -->
  <rect class="dg-panel" x="159" y="56" width="124" height="194" rx="4"/>
  <rect class="dg-node dg-node--alt" x="159" y="56" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="221" y="81" text-anchor="middle">2 · 저장</text>
  <rect class="dg-node dg-node--accent" x="159" y="104" width="124" height="86" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="221" y="130" text-anchor="middle">Amazon S3</text>
  <text class="dg-fs-sm" x="221" y="152" text-anchor="middle">데이터 레이크</text>
  <text class="dg-fs-sm" x="221" y="174" text-anchor="middle">원본을 그대로</text>
  <text class="dg-fs-sm dg-muted" x="221" y="212" text-anchor="middle">모든 단계가</text>
  <text class="dg-fs-sm dg-muted" x="221" y="230" text-anchor="middle">여기를 지납니다</text>

  <!-- 3 카탈로그 · 변환 -->
  <rect class="dg-panel" x="298" y="56" width="124" height="194" rx="4"/>
  <rect class="dg-node dg-node--alt" x="298" y="56" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="74" text-anchor="middle">3 · 카탈로그</text>
  <text class="dg-fs-sm dg-bold" x="360" y="90" text-anchor="middle">변환</text>
  <rect class="dg-node" x="298" y="104" width="124" height="86" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="130" text-anchor="middle">AWS Glue</text>
  <text class="dg-fs-sm" x="360" y="152" text-anchor="middle">크롤러 · 카탈로그</text>
  <text class="dg-fs-sm" x="360" y="174" text-anchor="middle">ETL 작업</text>
  <text class="dg-fs-sm dg-muted" x="360" y="212" text-anchor="middle">스키마를 알아내</text>
  <text class="dg-fs-sm dg-muted" x="360" y="230" text-anchor="middle">테이블로 등록</text>

  <!-- 4 조회 -->
  <rect class="dg-panel" x="437" y="56" width="124" height="194" rx="4"/>
  <rect class="dg-node dg-node--alt" x="437" y="56" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="499" y="81" text-anchor="middle">4 · 조회</text>
  <rect class="dg-node" x="437" y="104" width="124" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="499" y="126" text-anchor="middle">Amazon Athena</text>
  <text class="dg-fs-sm" x="499" y="146" text-anchor="middle">S3 를 그 자리에서</text>
  <rect class="dg-node" x="437" y="166" width="124" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="499" y="188" text-anchor="middle">Amazon Redshift</text>
  <text class="dg-fs-sm" x="499" y="208" text-anchor="middle">적재 후 반복 분석</text>

  <!-- 5 시각화 -->
  <rect class="dg-panel" x="576" y="56" width="124" height="194" rx="4"/>
  <rect class="dg-node dg-node--alt" x="576" y="56" width="124" height="40" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="638" y="81" text-anchor="middle">5 · 시각화</text>
  <rect class="dg-node" x="576" y="104" width="124" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="638" y="126" text-anchor="middle">QuickSight</text>
  <text class="dg-fs-sm" x="638" y="146" text-anchor="middle">대시보드</text>
  <text class="dg-fs-sm dg-muted" x="638" y="182" text-anchor="middle">조회 결과를</text>
  <text class="dg-fs-sm dg-muted" x="638" y="200" text-anchor="middle">사람이 읽는 형태로</text>

  <rect class="dg-node dg-node--empty" x="20" y="270" width="680" height="48" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="292" text-anchor="middle">서비스 이름만 나열된 문항은 각 이름이 어느 칸에 속하는지로 환원해 읽습니다</text>
  <text class="dg-fs-sm" x="360" y="310" text-anchor="middle">수집 · 저장 · 카탈로그와 변환 · 조회 · 시각화</text>
</svg>
