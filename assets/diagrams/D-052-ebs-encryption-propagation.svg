<svg viewBox="0 0 720 400" role="img" aria-labelledby="d052-title d052-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d052-title">EBS 암호화의 전파 경로</title>
  <desc id="d052-desc">위쪽은 암호화가 그대로 상속되는 경로입니다.
    KMS 키로 암호화해 만든 볼륨에서 뜬 스냅샷은 암호화 상태이고, 그 스냅샷을 복사해도, AMI 로 만들어도,
    다시 볼륨으로 복원해도 암호화 상태가 유지됩니다. 한 번 암호화된 것은 스스로 풀리지 않습니다.
    아래쪽은 암호화되지 않은 볼륨을 암호화 상태로 바꾸는 우회 경로입니다.
    볼륨의 암호화 설정을 직접 켜는 방법은 없으므로, 먼저 스냅샷을 뜨고 그 스냅샷을 복사할 때 암호화를 지정해
    암호화된 스냅샷을 만든 다음, 그 스냅샷에서 새 볼륨을 만들어 인스턴스에 다시 연결합니다.
    핵심은 반드시 스냅샷 복사 단계를 거쳐야 한다는 것입니다.</desc>

  <defs>
    <marker id="d052-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d052-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="30">암호화는 상속됩니다</text>

  <rect class="dg-node dg-node--ok" x="20" y="44" width="120" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="80" y="70" text-anchor="middle">암호화 볼륨</text>
  <text class="dg-fs-sm dg-muted" x="80" y="90" text-anchor="middle">KMS 키 지정</text>

  <rect class="dg-node dg-node--ok" x="176" y="44" width="120" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="236" y="70" text-anchor="middle">스냅샷</text>
  <text class="dg-fs-sm dg-muted" x="236" y="90" text-anchor="middle">암호화 유지</text>

  <rect class="dg-node dg-node--ok" x="332" y="44" width="120" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="392" y="70" text-anchor="middle">스냅샷 복사본</text>
  <text class="dg-fs-sm dg-muted" x="392" y="90" text-anchor="middle">키 교체 가능</text>

  <rect class="dg-node dg-node--ok" x="488" y="44" width="100" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="538" y="70" text-anchor="middle">AMI</text>
  <text class="dg-fs-sm dg-muted" x="538" y="90" text-anchor="middle">암호화 유지</text>

  <rect class="dg-node dg-node--ok" x="620" y="44" width="80" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="660" y="70" text-anchor="middle">새 볼륨</text>
  <text class="dg-fs-sm dg-muted" x="660" y="90" text-anchor="middle">암호화</text>

  <path class="dg-edge dg-edge--ok" d="M140 74 L172 74" marker-end="url(#d052-ar)"/>
  <path class="dg-edge dg-edge--ok" d="M296 74 L328 74" marker-end="url(#d052-ar)"/>
  <path class="dg-edge dg-edge--ok" d="M452 74 L484 74" marker-end="url(#d052-ar)"/>
  <path class="dg-edge dg-edge--ok" d="M588 74 L616 74" marker-end="url(#d052-ar)"/>

  <text class="dg-fs-sm dg-muted" x="20" y="128">한 번 암호화된 것은 이 경로 어디에서도 저절로 풀리지 않습니다</text>

  <path class="dg-grid" d="M20 144 L700 144"/>
  <text class="dg-fs-md dg-bold" x="20" y="170">미암호화 볼륨을 암호화로 바꾸는 우회 경로</text>

  <rect class="dg-node dg-node--danger" x="20" y="186" width="150" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="95" y="212" text-anchor="middle">미암호화 볼륨</text>
  <text class="dg-fs-sm" x="95" y="234" text-anchor="middle">직접 켤 수 없음</text>

  <rect class="dg-node" x="200" y="186" width="150" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="275" y="212" text-anchor="middle">스냅샷</text>
  <text class="dg-fs-sm dg-muted" x="275" y="234" text-anchor="middle">여전히 미암호화</text>

  <rect class="dg-node dg-node--accent" x="380" y="186" width="170" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="465" y="212" text-anchor="middle">복사하며 암호화 지정</text>
  <text class="dg-fs-sm" x="465" y="234" text-anchor="middle">이 단계가 반드시 필요</text>

  <rect class="dg-node dg-node--ok" x="580" y="186" width="120" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="640" y="212" text-anchor="middle">암호화 볼륨</text>
  <text class="dg-fs-sm dg-muted" x="640" y="234" text-anchor="middle">다시 연결</text>

  <path class="dg-edge" d="M170 219 L196 219" marker-end="url(#d052-ar)"/>
  <path class="dg-edge dg-edge--accent" d="M350 219 L376 219" marker-end="url(#d052-ar-accent)"/>
  <path class="dg-edge dg-edge--accent" d="M550 219 L576 219" marker-end="url(#d052-ar-accent)"/>

  <path class="dg-edge dg-edge--danger dg-edge--dashed" d="M95 252 L95 286 L640 286 L640 256" marker-end="url(#d052-ar)"/>
  <path class="dg-x" d="M354 275 L370 291 M370 275 L354 291"/>
  <text class="dg-fs-sm dg-bold" x="200" y="280">볼륨을 바로 암호화로 전환하는 길은 없습니다</text>

  <rect class="dg-node dg-node--accent" x="20" y="312" width="680" height="72" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="336" text-anchor="middle">암호화를 나중에 켜려면 스냅샷 복사 단계를 반드시 거칩니다</text>
  <text class="dg-fs-sm" x="360" y="358" text-anchor="middle">스냅샷 → 암호화 지정 복사 → 새 볼륨 생성 → 인스턴스에 다시 연결</text>
  <text class="dg-fs-sm" x="360" y="378" text-anchor="middle">계정·리전 단위로 기본 암호화를 켜 두면 새로 만드는 볼륨이 처음부터 암호화됩니다</text>
</svg>
