<svg viewBox="0 0 720 490" role="img" aria-labelledby="d113-title d113-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d113-title">SQS 표준 큐와 FIFO 큐, 그리고 메시지 수명주기</title>
  <desc id="d113-desc">생산자가 1, 2, 3, 4 순서로 보낸 같은 메시지 열을 두 종류의 큐에 각각 넣었을 때
    소비자가 무엇을 받게 되는지 비교합니다. 표준 큐에서는 순서가 뒤섞여 도착할 수 있고 같은 메시지가 두 번 올 수 있습니다.
    대신 처리량에 사실상 제한이 없습니다. FIFO 큐에서는 메시지 그룹 ID 로 묶인 그룹 안에서만 엄격한 순서가 보장되고
    중복 제거가 이루어집니다. 서로 다른 그룹 사이의 순서는 보장되지 않으며 처리량은 배치 없이 초당 300개,
    배치를 쓰면 초당 3,000개가 기준입니다.
    아래쪽은 두 큐에 공통으로 적용되는 메시지 수명주기입니다. 소비자가 메시지를 수신하면 가시성 제한 시간 동안
    다른 소비자에게 보이지 않게 감춰집니다. 기본값은 30초입니다.
    그 안에 처리를 마치고 DeleteMessage 를 호출하면 메시지가 사라지지만, 호출하지 못한 채 시간이 지나면
    메시지가 큐에 다시 나타나고 수신 횟수가 하나 늘어납니다.
    이 수신 횟수가 재드라이브 정책의 maxReceiveCount 를 넘으면 메시지는 배달 못 한 편지 큐로 옮겨집니다.</desc>

  <defs>
    <marker id="d113-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d113-ar-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--ok" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d113-ar-warn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--warn" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d113-ar-danger" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--danger" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- 생산자 -->
  <text class="dg-fs-md dg-bold" x="20" y="42">생산자가 보낸 순서</text>
  <rect class="dg-node dg-node--accent" x="200" y="22" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="217" y="42" text-anchor="middle">1</text>
  <rect class="dg-node dg-node--accent" x="240" y="22" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="257" y="42" text-anchor="middle">2</text>
  <rect class="dg-node dg-node--accent" x="280" y="22" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="297" y="42" text-anchor="middle">3</text>
  <rect class="dg-node dg-node--accent" x="320" y="22" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="337" y="42" text-anchor="middle">4</text>
  <text class="dg-fs-sm dg-muted" x="370" y="42">같은 열을 두 큐에 똑같이 넣습니다</text>

  <!-- 표준 큐 -->
  <rect class="dg-panel" x="20" y="66" width="330" height="200" rx="4"/>
  <text class="dg-fs-md dg-bold" x="34" y="90">표준 큐</text>
  <text class="dg-fs-sm dg-muted" x="34" y="112">소비자가 받는 순서 (예)</text>

  <rect class="dg-node" x="34" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="51" y="140" text-anchor="middle">2</text>
  <rect class="dg-node" x="74" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="91" y="140" text-anchor="middle">1</text>
  <rect class="dg-node" x="114" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="131" y="140" text-anchor="middle">3</text>
  <rect class="dg-node dg-node--warn" x="154" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="171" y="140" text-anchor="middle">3</text>
  <rect class="dg-node" x="194" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="211" y="140" text-anchor="middle">4</text>
  <text class="dg-fs-sm dg-bold" x="171" y="166" text-anchor="middle">중복</text>

  <text class="dg-fs-sm" x="34" y="196">순서 보장 없음 — 최선 노력</text>
  <text class="dg-fs-sm" x="34" y="216">중복 전달 가능 — 최소 1회 전달</text>
  <text class="dg-fs-sm" x="34" y="236">처리량에 사실상 제한이 없습니다</text>
  <text class="dg-fs-sm dg-muted" x="34" y="256">소비자가 멱등하게 만들어야 합니다</text>

  <!-- FIFO 큐 -->
  <rect class="dg-panel" x="370" y="66" width="330" height="200" rx="4"/>
  <text class="dg-fs-md dg-bold" x="384" y="90">FIFO 큐</text>
  <text class="dg-fs-sm dg-muted" x="384" y="112">메시지 그룹 안에서만 순서 보장</text>

  <text class="dg-fs-sm dg-bold" x="384" y="140">그룹 A</text>
  <rect class="dg-node dg-node--ok" x="444" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="461" y="140" text-anchor="middle">1</text>
  <rect class="dg-node dg-node--ok" x="484" y="120" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="501" y="140" text-anchor="middle">3</text>
  <text class="dg-fs-sm dg-muted" x="530" y="140">순서 그대로</text>

  <text class="dg-fs-sm dg-bold" x="384" y="176">그룹 B</text>
  <rect class="dg-node dg-node--ok" x="444" y="156" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="461" y="176" text-anchor="middle">2</text>
  <rect class="dg-node dg-node--ok" x="484" y="156" width="34" height="28" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="501" y="176" text-anchor="middle">4</text>
  <text class="dg-fs-sm dg-muted" x="530" y="176">순서 그대로</text>

  <text class="dg-fs-sm" x="384" y="206">그룹이 다르면 서로의 순서는 무관합니다</text>
  <text class="dg-fs-sm" x="384" y="226">중복 제거 — 정확히 한 번 처리</text>
  <text class="dg-fs-sm" x="384" y="246">초당 300개 · 배치 사용 시 초당 3,000개</text>
  <text class="dg-fs-sm dg-muted" x="384" y="266">MessageGroupId 를 빠뜨리면 전송이 실패합니다</text>

  <!-- 수명주기 -->
  <text class="dg-fs-md dg-bold" x="20" y="300">메시지 수명주기 — 두 큐에 공통입니다</text>

  <rect class="dg-node" x="20" y="312" width="120" height="50" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="80" y="342" text-anchor="middle">소비자가 수신</text>

  <path class="dg-edge" d="M140 337 L152 337" marker-end="url(#d113-ar)"/>

  <rect class="dg-node dg-node--accent" x="158" y="312" width="150" height="50" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="233" y="334" text-anchor="middle">가시성 제한 시간</text>
  <text class="dg-fs-sm" x="233" y="352" text-anchor="middle">동안 감춰집니다 (기본 30초)</text>

  <path class="dg-edge dg-edge--ok" d="M308 328 L318 302" marker-end="url(#d113-ar-ok)"/>
  <rect class="dg-node dg-node--ok" x="324" y="276" width="160" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="404" y="302" text-anchor="middle">DeleteMessage — 사라짐</text>

  <path class="dg-edge dg-edge--warn" d="M308 348 L318 372" marker-end="url(#d113-ar-warn)"/>
  <rect class="dg-node dg-node--warn" x="324" y="352" width="160" height="50" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="404" y="374" text-anchor="middle">시간이 지나면 다시 보임</text>
  <text class="dg-fs-sm" x="404" y="392" text-anchor="middle">수신 횟수 +1</text>

  <path class="dg-edge dg-edge--danger" d="M484 377 L508 377" marker-end="url(#d113-ar-danger)"/>
  <rect class="dg-node dg-node--danger" x="514" y="352" width="186" height="50" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="607" y="374" text-anchor="middle">배달 못 한 편지 큐 (DLQ)</text>
  <text class="dg-fs-sm dg-mono" x="607" y="392" text-anchor="middle">maxReceiveCount 초과</text>

  <path class="dg-edge dg-edge--warn dg-edge--dashed" d="M340 402 L340 416 L80 416 L80 366" marker-end="url(#d113-ar-warn)"/>
  <text class="dg-fs-sm dg-muted" x="200" y="434" text-anchor="middle">한도 안이면 다시 수신됩니다</text>

  <!-- 결론 -->
  <rect class="dg-node dg-node--accent" x="20" y="444" width="680" height="38" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="468" text-anchor="middle">순서와 중복 제거가 요구되면 FIFO, 처리량이 요구되면 표준 — 큐 타입은 만든 뒤 바꿀 수 없습니다</text>
</svg>
