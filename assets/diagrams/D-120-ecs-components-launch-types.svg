<svg viewBox="0 0 720 450" role="img" aria-labelledby="d120-title d120-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d120-title">ECS 구성요소의 포함 관계와 두 시작 유형의 책임 경계</title>
  <desc id="d120-desc">왼쪽은 Amazon ECS 의 포함 관계입니다. 가장 바깥이 클러스터이고 그 안에 서비스가 있으며,
    서비스는 원하는 태스크 개수를 계속 유지하는 역할을 합니다. 태스크는 함께 배치되는 컨테이너들의 묶음이고,
    태스크 정의는 그 태스크를 어떻게 만들지 적어 둔 청사진입니다.
    이미지 주소, CPU 와 메모리, 태스크 역할과 태스크 실행 역할, 로그 설정이 여기 들어갑니다.
    태스크 정의 자체는 실행되는 것이 아니라 참조되는 문서입니다.
    오른쪽은 두 시작 유형의 책임 경계입니다. EC2 시작 유형에서는 컨테이너를 실제로 돌리는
    컨테이너 인스턴스가 고객 책임으로 남아 있어 AMI 갱신과 패치, 인스턴스 수 조정을 직접 해야 합니다.
    AWS Fargate 에서는 그 계층 자체가 사라져 고객이 신경 쓸 것은 컨테이너 이미지와 태스크 정의뿐입니다.
    운영 부담을 줄이라는 요구가 Fargate 를 가리키는 이유가 정확히 이 한 층의 차이입니다.</desc>

  <defs>
    <marker id="d120-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <text class="dg-fs-md dg-bold" x="20" y="26">포함 관계와, 시작 유형에 따라 사라지는 한 층</text>

  <!-- 왼쪽: 포함 관계 -->
  <rect class="dg-panel" x="20" y="40" width="330" height="336" rx="4"/>

  <rect class="dg-node dg-node--alt" x="34" y="60" width="302" height="220" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="46" y="80">클러스터</text>

  <rect class="dg-node" x="46" y="88" width="278" height="180" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="58" y="108">서비스 — 원하는 개수를 유지합니다</text>

  <rect class="dg-node dg-node--alt" x="58" y="118" width="254" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="70" y="138">태스크</text>
  <rect class="dg-node" x="70" y="146" width="114" height="40" rx="4"/>
  <text class="dg-fs-sm" x="127" y="171" text-anchor="middle">컨테이너</text>
  <rect class="dg-node" x="192" y="146" width="110" height="40" rx="4"/>
  <text class="dg-fs-sm" x="247" y="171" text-anchor="middle">컨테이너</text>

  <rect class="dg-node dg-node--alt" x="58" y="204" width="254" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="70" y="224">태스크</text>
  <text class="dg-fs-sm dg-muted" x="70" y="244">같은 태스크 정의로 만들어집니다</text>

  <path class="dg-edge dg-edge--dashed" d="M185 296 L185 284" marker-end="url(#d120-ar)"/>
  <text class="dg-fs-sm dg-muted" x="196" y="294">청사진</text>

  <rect class="dg-node" x="34" y="300" width="302" height="62" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="46" y="322">태스크 정의</text>
  <text class="dg-fs-sm dg-muted" x="46" y="342">이미지 · CPU · 메모리 · 역할 · 로그 설정</text>
  <text class="dg-fs-sm dg-muted" x="46" y="358">실행되는 것이 아니라 참조되는 문서입니다</text>

  <!-- 오른쪽: 책임 경계 -->
  <rect class="dg-panel" x="370" y="40" width="330" height="336" rx="4"/>

  <text class="dg-fs-sm dg-bold" x="384" y="72">EC2 시작 유형</text>

  <rect class="dg-node" x="384" y="80" width="302" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="98">컨테이너 이미지 · 태스크 정의</text>
  <text class="dg-fs-sm dg-muted" x="396" y="116">고객 책임</text>

  <rect class="dg-node dg-node--accent" x="384" y="126" width="302" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="144">컨테이너 인스턴스 (EC2)</text>
  <text class="dg-fs-sm dg-bold" x="396" y="162">고객 책임 — AMI 갱신 · 패치 · 대수 조정</text>

  <rect class="dg-node dg-node--muted" x="384" y="172" width="302" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="190">하이퍼바이저 · 하드웨어</text>
  <text class="dg-fs-sm dg-muted" x="396" y="208">AWS 책임</text>

  <text class="dg-fs-sm dg-bold" x="384" y="248">AWS Fargate</text>

  <rect class="dg-node" x="384" y="256" width="302" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="274">컨테이너 이미지 · 태스크 정의</text>
  <text class="dg-fs-sm dg-muted" x="396" y="292">고객 책임</text>

  <rect class="dg-node dg-node--empty" x="384" y="302" width="302" height="42" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="320">컨테이너 인스턴스 계층이 없습니다</text>
  <text class="dg-fs-sm dg-muted" x="396" y="338">AWS 가 가져갑니다</text>

  <rect class="dg-node dg-node--muted" x="384" y="348" width="302" height="24" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="396" y="365">하이퍼바이저 · 하드웨어 — AWS 책임</text>

  <!-- 결론 -->
  <rect class="dg-node dg-node--accent" x="20" y="388" width="680" height="56" rx="4"/>
  <text class="dg-fs-md dg-bold" x="360" y="412" text-anchor="middle">두 시작 유형의 차이는 딱 한 층입니다</text>
  <text class="dg-fs-sm" x="360" y="434" text-anchor="middle">"인스턴스 관리 부담을 없애라"는 요구가 Fargate 를 가리키는 이유가 이 한 층입니다</text>
</svg>
