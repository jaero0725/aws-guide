<svg viewBox="0 0 720 498" role="img" aria-labelledby="d133-title d133-desc"
     class="ag-diagram" preserveAspectRatio="xMidYMid meet">
  <title id="d133-title">CloudFront 와 Global Accelerator 의 경로 대비</title>
  <desc id="d133-desc">두 서비스의 트래픽 경로를 위아래 두 레인으로 나누어 비교합니다.
    위쪽 레인은 Amazon CloudFront 입니다. 사용자의 HTTP 또는 HTTPS 요청이 가장 가까운 엣지 로케이션에 도착하고,
    캐시에 적중하면 오리진까지 가지 않고 엣지에서 바로 응답합니다. 미스일 때만 AWS 백본을 타고 오리진으로 올라갑니다.
    콘텐츠를 엣지에 두고 돌려주는 것이 목적이므로 캐시 가능한 콘텐츠에서 가장 큰 효과를 냅니다.
    아래쪽 레인은 AWS Global Accelerator 입니다. 애니캐스트 고정 IP 두 개를 받아 두면 사용자는 언제나 가장 가까운 엣지로 들어오고,
    트래픽은 캐시 없이 AWS 백본을 타고 리전의 ALB, NLB, EC2, 탄력적 IP 같은 엔드포인트로 곧장 전달됩니다.
    TCP 와 UDP 를 그대로 다루므로 캐시할 수 없는 트래픽이나 게임, 음성, IoT 같은 비 HTTP 워크로드가 대상입니다.
    아래쪽 세 상자는 보호 장치가 붙는 지점입니다. AWS WAF 는 CloudFront 와 ALB 와 API Gateway 에 붙고,
    Shield Standard 는 모든 고객에게 기본 적용되며, Shield Advanced 는 CloudFront, Global Accelerator, Route 53, 탄력적 IP 등에 붙습니다.</desc>

  <defs>
    <marker id="d133-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="d133-ar-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path class="dg-marker dg-marker--accent" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <!-- 레인 A -->
  <text class="dg-fs-md dg-bold" x="20" y="26">Amazon CloudFront — 캐시 가능한 HTTP 응답을 엣지에서 돌려줍니다</text>
  <rect class="dg-panel" x="20" y="34" width="680" height="132" rx="4"/>

  <rect class="dg-node" x="34" y="70" width="100" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="84" y="98" text-anchor="middle">사용자</text>
  <text class="dg-fs-sm dg-muted" x="84" y="118" text-anchor="middle">HTTP/HTTPS</text>

  <path class="dg-edge dg-edge--accent" d="M138 100 L172 100" marker-end="url(#d133-ar-accent)"/>

  <rect class="dg-node dg-node--accent" x="176" y="60" width="200" height="80" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="276" y="84" text-anchor="middle">엣지 로케이션 · 캐시</text>
  <text class="dg-fs-sm" x="276" y="106" text-anchor="middle">적중하면 여기서 응답</text>
  <text class="dg-fs-sm dg-bold" x="276" y="128" text-anchor="middle">오리진까지 가지 않습니다</text>

  <path class="dg-edge dg-edge--dashed" d="M380 100 L456 100" marker-end="url(#d133-ar)"/>
  <text class="dg-fs-sm dg-muted" x="418" y="92" text-anchor="middle">미스일 때만</text>
  <text class="dg-fs-sm dg-muted" x="418" y="122" text-anchor="middle">백본 경유</text>

  <rect class="dg-node" x="460" y="70" width="224" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="572" y="94" text-anchor="middle">오리진</text>
  <text class="dg-fs-sm dg-muted" x="572" y="116" text-anchor="middle">Amazon S3 · ALB · 커스텀</text>

  <!-- 레인 B -->
  <text class="dg-fs-md dg-bold" x="20" y="192">AWS Global Accelerator — 캐시 없이 백본으로 곧장 보냅니다</text>
  <rect class="dg-panel" x="20" y="200" width="680" height="132" rx="4"/>

  <rect class="dg-node" x="34" y="236" width="100" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="84" y="264" text-anchor="middle">사용자</text>
  <text class="dg-fs-sm dg-muted" x="84" y="284" text-anchor="middle">TCP · UDP</text>

  <path class="dg-edge" d="M138 266 L172 266" marker-end="url(#d133-ar)"/>

  <rect class="dg-node" x="176" y="226" width="200" height="80" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="276" y="250" text-anchor="middle">애니캐스트 고정 IP 2개</text>
  <text class="dg-fs-sm" x="276" y="272" text-anchor="middle">가장 가까운 엣지로 진입</text>
  <text class="dg-fs-sm dg-bold" x="276" y="294" text-anchor="middle">캐시하지 않습니다</text>

  <path class="dg-edge" d="M380 266 L456 266" marker-end="url(#d133-ar)"/>
  <text class="dg-fs-sm dg-muted" x="418" y="258" text-anchor="middle">AWS 백본</text>
  <text class="dg-fs-sm dg-muted" x="418" y="288" text-anchor="middle">직행</text>

  <rect class="dg-node" x="460" y="236" width="224" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="572" y="260" text-anchor="middle">리전 엔드포인트</text>
  <text class="dg-fs-sm dg-muted" x="572" y="282" text-anchor="middle">ALB · NLB · EC2 · 탄력적 IP</text>

  <!-- 보호 장치가 붙는 지점 -->
  <text class="dg-fs-md dg-bold" x="20" y="358">보호 장치가 붙는 지점</text>

  <rect class="dg-node dg-node--alt" x="20" y="366" width="220" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="34" y="390">AWS WAF</text>
  <text class="dg-fs-sm" x="34" y="410">CloudFront · ALB</text>
  <text class="dg-fs-sm" x="34" y="426">API Gateway 에 붙습니다</text>

  <rect class="dg-node dg-node--alt" x="250" y="366" width="220" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="264" y="390">Shield Standard</text>
  <text class="dg-fs-sm" x="264" y="410">모든 고객에 기본 적용</text>
  <text class="dg-fs-sm" x="264" y="426">별도 설정이 없습니다</text>

  <rect class="dg-node dg-node--alt" x="480" y="366" width="220" height="66" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="494" y="390">Shield Advanced</text>
  <text class="dg-fs-sm" x="494" y="410">CloudFront · Accelerator</text>
  <text class="dg-fs-sm" x="494" y="426">Route 53 · 탄력적 IP</text>

  <rect class="dg-node dg-node--empty" x="20" y="442" width="680" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="469" text-anchor="middle">캐시할 수 있으면 CloudFront · 고정 IP 나 비 HTTP 면 Global Accelerator</text>
</svg>
